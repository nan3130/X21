<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำนวณข้อมูล</title>
</head>
<body>

  <h2>กรุณากรอกข้อมูล:</h2>

  <!-- ช่องกรอกข้อมูลสำหรับ Base -->
  <label for="bstr">Base Strength (bstr):</label>
  <input type="number" id="bstr" value="1">
  <br>
  <label for="bagi">Base Agility (bagi):</label>
  <input type="number" id="bagi" value="1">
  <br>

  <!-- ช่องกรอกข้อมูลสำหรับ Stribe -->
  <label for="estrpercent">Strength %:</label>
  <input type="number" id="estrpercent" value="0">
  <br>
  <label for="estrflat">Strength Flat:</label>
  <input type="number" id="estrflat" value="0">
  <br>

  <!-- ช่องกรอกข้อมูลสำหรับ Agility -->
  <label for="eagipercent">Agility %:</label>
  <input type="number" id="eagipercent" value="0">
  <br>
  <label for="eagiflat">Agility Flat:</label>
  <input type="number" id="eagiflat" value="0">
  <br>

  <!-- ช่องกรอกข้อมูลสำหรับ critical -->
  <label for="ecdpercent">Critical %:</label>
  <input type="number" id="ecdpercent" value="0">
  <br>
  <label for="ecdflat">Critical Flat:</label>
  <input type="number" id="ecdflat" value="0">
  <br>


  <label for="lvsb">Level SB:</label>
  <select id="lvsb">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="9">9</option>
    <option value="10">10</option>
  </select>
  <br>
  
  <label for="lvcriup">Level CRIUP:</label>
  <select id="lvcriup">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="9">9</option>
    <option value="10">10</option>
  </select>
  <br>
  
  <label for="lvgodspd">Level God Speed:</label>
  <select id="lvgodspd">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="9">9</option>
    <option value="10">10</option>
  </select>
  <br>
  
  <!-- ช่องกรอกข้อมูลสำหรับ Pet Buff -->
  <label for="levelcriuppet">Level CRIUP Pet:</label>
  <select id="levelcriuppet">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
    <option value="9">9</option>
    <option value="10">10</option>
  </select>
  <br>
  
  <label for="redArrow">Red Arrow:</label>
  <input type="checkbox" id="redArrow">
  <br>
  <label for="onOff">Pet Buff On/Off:</label>
  <input type="checkbox" id="onOff">
  <br>

  <!-- คำนวณและแสดงผล -->
  <button onclick="calculate()">คำนวณ</button>

  <h3>ผลลัพธ์:</h3>
  <div>
    <p id="outputBaseResult">Base Result: </p>
    <p id="outputTotalCD">Total CD: </p>
  </div>

  <script>
    function calculate() {
      // รับค่าต่างๆ จาก HTML
      var bstr = parseFloat(document.getElementById('bstr').value) || 0;
      var bagi = parseFloat(document.getElementById('bagi').value) || 0;
      var estrpercent = parseFloat(document.getElementById('estrpercent').value) || 0;
      var estrflat = parseFloat(document.getElementById('estrflat').value) || 0;
      var eagipercent = parseFloat(document.getElementById('eagipercent').value) || 0;
      var eagiflat = parseFloat(document.getElementById('eagiflat').value) || 0;
      var ecdpercent = parseFloat(document.getElementById('ecdpercent').value) || 0;
      var ecdflat = parseFloat(document.getElementById('ecdflat').value) || 0;
      var lvsb = parseInt(document.getElementById('lvsb').value) || 0;
      var lvcriup = parseInt(document.getElementById('lvcriup').value) || 0;
      var lvgodspd = parseInt(document.getElementById('lvgodspd').value) || 0;
      var levelcriuppet = parseInt(document.getElementById('levelcriuppet').value) || 0;
      var redArrow = document.getElementById('redArrow').checked;
      var onOff = document.getElementById('onOff').checked;

      // คำนวณค่าต่างๆ
      var cdfromcriup = Math.floor(lvcriup / 2);

      // สำหรับ Agility Value
      const agiValues = [1, 2, 3, 4, 5, 7, 9, 11, 13, 15];
      var agifromgodspd = (lvgodspd >= 1 && lvgodspd <= 10) ? agiValues[lvgodspd - 1] : 0;

      // คำนวณ Buff Pet CRIUP
      var cdfromcriuppet = 0;
      if (onOff === true) {
        cdfromcriuppet = levelcriuppet + (redArrow ? 2 : 0);
      }

      // รวมค่าทั้งหมด
      var ttstrpercent = estrpercent;
      var ttagipercent = eagipercent;
      var ttstrflat = estrflat;
      var ttagiflat = eagiflat + agifromgodspd;
      var ttcdpercent = cdfromcriup + ecdpercent;
      var ttcdflat = cdfromcriuppet + ecdflat ;

      // คำนวณ Base Result
      var baseResult;
      if (bstr >= bagi) {
        baseResult = ((bstr * (1 + ttstrpercent / 100) + ttstrflat) / 5) + 150;
      } else {
        baseResult = ((bstr * (1 + ttstrpercent / 100) + ttstrflat) + (bagi * (1 + ttagipercent / 100) + ttagiflat)) / 10 + 150;
      }

      // คำนวณ Total CD
      var totalcd = baseResult * (1 + ttcdpercent / 100) + ttcdflat;

      // ตรวจสอบเงื่อนไขผลลัพธ์
      if (totalcd > 300) {
        totalcd = ((totalcd - 300) / 2) + 300;
      }

      // ปัดเศษลง
      var roundedResult = Math.floor(totalcd);
      var roundedResultmcd = Math.floor((totalcd - 100) * (0.5 + 0.025 * lvsb) + 100);

      // แสดงผลลัพธ์ใน HTML
      document.getElementById('outputBaseResult').innerText = "CD: " + roundedResult;
      document.getElementById('outputTotalCD').innerText = "MCD: " + roundedResultmcd;
    }
  </script>

</body>
</html>
